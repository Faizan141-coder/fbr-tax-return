# NayaPay CSV export.
#
# STATUS: written against synthetic fixtures. Lines marked VERIFY need a real
# `fbr-dump`. Research 03 confirms the app exports "PDF or CSV", but the CSV
# columns are undocumented.
#
# Open question from the spec: public NayaPay samples DO print Opening and
# Closing Balance on the summary card, contradicting the original brief. The
# summary patterns below assume they are present; if a real export omits them,
# delete those two lines and the account will fall back to a manual anchor.

id          = "nayapay.csv.v1"
institution = "NayaPay"
container   = "csv"
valid_from  = 2025-07-01
notes       = "CSV export from the NayaPay app (More -> Statements)."

[detect]
header_contains = ["Date", "Type", "Amount", "Balance"]    # VERIFY

[columns]
date        = "Date"                                       # VERIFY
type        = "Type"                                       # VERIFY
description = "Description"                                # VERIFY
amount      = "Amount"                                     # VERIFY
balance     = "Balance"                                    # VERIFY

[formats]
dates = ["%d %b %Y", "%d-%b-%Y"]                           # VERIFY
sign  = "signed"

[rows]
skip = ['(?i)carried\s+forward', '(?i)^\s*page\s+\d+\s+of\s+\d+']

[summary]
# Correction (carried forward from an earlier task's exact defect): `\D`
# matches a newline, so a pattern anchored on `\D+?` as the separator can
# reach clean across this preamble's other lines and harvest a value that
# belongs to a different row entirely. `[^\d\n]+?` is the same "skip the
# label text" separator but stops at the row boundary. The value itself
# also now tolerates a leading `-` (`-?`) so a negative/overdrawn balance
# keeps its sign - a GREEDY `[^\d\n]+` would itself swallow that minus sign
# before the value group ever saw it, silently flipping the balance to
# positive, which is why the separator stays non-greedy (`+?`).
opening      = '(?i)Opening\s+Balance[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'   # VERIFY it exists
closing      = '(?i)Closing\s+Balance[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'   # VERIFY it exists
total_credit = '(?i)Total\s+Income[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'      # VERIFY
total_debit  = '(?i)Total\s+Spent[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'       # VERIFY
# Final fix round, Finding 3: without these two, summary.period_start/end are
# always None, so date_range is a permanent warn and Document.period_start/end
# fall back to the first and last PRINTED transaction - which makes a clean
# full-year statement report a gap it does not have, and the account
# "incomplete". The synthetic writer now prints a "Statement Period" row,
# same additive style as the Total Income/Total Spent rows above and equally
# unconfirmed against a real export. period_to re-matches the first date and
# takes the SECOND one on the same line.
period_from  = '(?i)STATEMENT\s+PERIOD[^\d\n]+?(?P<value>\d{1,2}\s+[A-Za-z]{3}\s+\d{4})'   # VERIFY
period_to    = '(?i)STATEMENT\s+PERIOD[^\d\n]+?\d{1,2}\s+[A-Za-z]{3}\s+\d{4}[^\d\n]+?(?P<value>\d{1,2}\s+[A-Za-z]{3}\s+\d{4})'   # VERIFY

[balance]
semantics = "running"
kind      = "ledger"

[selftest]
summary_sample = """
Account,PK00TEST0000000000000000
Opening Balance,5,000.00
Closing Balance,25,935.59
Total Income,43,513.93
Total Spent,22,578.34
Statement Period,01 Jul 2025 to 23 Aug 2025
"""

# What each [summary] pattern must CAPTURE out of summary_sample above: integer
# paisa for a money role, an ISO date for a period role. summary_sample alone
# only proves a pattern matches SOMETHING - it passed happily with `opening`
# aimed at the closing balance. These pin WHICH figure each pattern reads,
# which is the mistake that puts a wrong number on a return.
[selftest.summary_expect]
opening      = 500000        # Rs 5,000.00
closing      = 2593559       # Rs 25,935.59
total_credit = 4351393       # Rs 43,513.93  (Total Income)
total_debit  = 2257834       # Rs 22,578.34  (Total Spent)
period_from  = "2025-07-01"
period_to    = "2025-08-23"

[[selftest.cases]]
row = { "Date" = "01 Jul 2025", "Time" = "10:15 AM", "Type" = "IBFT In", "Description" = "Incoming fund transfer", "Amount" = "+Rs. 5,000.00", "Balance" = "Rs. 15,000.00" }
expect_date   = 2025-07-01
expect_amount = 500000

[[selftest.cases]]
row = { "Date" = "02 Jul 2025", "Time" = "11:00 AM", "Type" = "IBFT Out", "Description" = "Outgoing fund transfer", "Amount" = "-Rs. 2,000.00", "Balance" = "Rs. 13,000.00" }
expect_date   = 2025-07-02
expect_amount = -200000
