# Meezan Bank CSV export.
#
# STATUS: written against synthetic fixtures. Every line marked VERIFY must be
# confirmed against a real `fbr-dump` before this profile is trusted on a
# real statement.
#
# Known from research 03: the CSV export puts Debit BEFORE Credit, the reverse
# of the app PDF. Columns are mapped by name, so the order does not matter -
# but the LABELS below must match the real export exactly.

id          = "meezan.csv.v1"
institution = "Meezan Bank Limited"
container   = "csv"
valid_from  = 2025-07-01
notes       = "CSV/XLSX export from the Meezan app or internet banking."

[detect]
header_contains = ["Booking Date", "Value Date"]   # VERIFY against a real export

[columns]
date        = "Booking Date"                       # VERIFY
value_date  = "Value Date"                         # VERIFY
reference   = "Doc No"                             # VERIFY
description = "Description"                        # VERIFY
debit       = "Debit"                              # VERIFY
credit      = "Credit"                             # VERIFY
balance     = "Available Balance"                  # VERIFY

[formats]
dates = ["%d %b %Y", "%d/%m/%Y", "%d/%m/%y"]       # VERIFY which one the export uses
sign  = "columns"

[rows]
skip = ['(?i)^\s*(opening|closing)\s+balance']

[summary]
# Correction (carried forward from an earlier task's exact defect): `\D`
# matches a newline, so a pattern anchored on `\D+?` as the separator can
# reach clean across this preamble's other lines and harvest a value that
# belongs to a different row entirely. `[^\d\n]+?` is the same "skip the
# label text" separator but stops at the row boundary. The value itself
# also now tolerates a leading `-` (`-?`) so a negative/overdrawn balance
# keeps its sign - a GREEDY `[^\d\n]+` would itself swallow that minus sign
# before the value group ever saw it, silently flipping the balance to
# positive, which is why the separator stays non-greedy (`+?`).
opening      = '(?i)OPENING\s+BALANCE[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'   # VERIFY
closing      = '(?i)CLOSING\s+BALANCE[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'   # VERIFY
# Fix round 1, Finding 2: the writer also prints Total Credit/Total Debit,
# but nothing checked them against the parsed totals until now.
total_credit = '(?i)Total\s+Credit[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'      # VERIFY
total_debit  = '(?i)Total\s+Debit[^\d\n]+?(?P<value>-?[\d,]+\.\d{2})'       # VERIFY
# Final fix round, Finding 3: without these two, summary.period_start/end are
# always None, so date_range is a permanent warn and Document.period_start/end
# fall back to the first and last PRINTED transaction - which makes a clean
# full-year statement report a gap over the days between 1 July and its own
# first transaction, and the account "incomplete". The gap warning is the
# signal for genuinely missing data; firing it always trains the owner to
# ignore it. period_to re-matches the first date and takes the SECOND one on
# the same line, because both ends of the period are printed together
# ("Statement Period,01 Jul 2025 to 30 Jun 2026").
period_from  = '(?i)STATEMENT\s+PERIOD[^\d\n]+?(?P<value>\d{1,2}\s+[A-Za-z]{3}\s+\d{4})'   # VERIFY
period_to    = '(?i)STATEMENT\s+PERIOD[^\d\n]+?\d{1,2}\s+[A-Za-z]{3}\s+\d{4}[^\d\n]+?(?P<value>\d{1,2}\s+[A-Za-z]{3}\s+\d{4})'   # VERIFY

[balance]
semantics = "running"
# VERIFY: does "Available Balance" behave as a ledger running balance, or does
# it differ when funds are on hold? (spec §12)
kind      = "available"

[selftest]
summary_sample = """
PK00TEST0000000000000000,ACCOUNT TITLE
OPENING BALANCE,PKR 5,000.00
CLOSING BALANCE,PKR 25,935.59
Total Credit,PKR 43,513.93
Total Debit,PKR 22,578.34
Currency,PKR
Statement Period,01 Jul 2025 to 23 Aug 2025
"""

# What each [summary] pattern must CAPTURE out of summary_sample above: integer
# paisa for a money role, an ISO date for a period role. summary_sample alone
# only proves a pattern matches SOMETHING - it passed happily with `opening`
# aimed at the closing balance. These pin WHICH figure each pattern reads,
# which is the mistake that puts a wrong number on a return.
[selftest.summary_expect]
opening      = 500000        # Rs 5,000.00
closing      = 2593559       # Rs 25,935.59
total_credit = 4351393       # Rs 43,513.93
total_debit  = 2257834       # Rs 22,578.34
period_from  = "2025-07-01"
period_to    = "2025-08-23"

[[selftest.cases]]
row = { "Booking Date" = "01 Jul 2025", "Value Date" = "01 Jul 2025", "Doc No" = "D00001", "Description" = "Top-up", "Debit" = "", "Credit" = "1,000.00", "Available Balance" = "1,000.00" }
expect_date   = 2025-07-01
expect_amount = 100000

[[selftest.cases]]
row = { "Booking Date" = "15 Jan 2026", "Value Date" = "15 Jan 2026", "Doc No" = "D00002", "Description" = "ATM Cash Withdrawal", "Debit" = "2,500.00", "Credit" = "", "Available Balance" = "7,500.00" }
expect_date   = 2026-01-15
expect_amount = -250000
