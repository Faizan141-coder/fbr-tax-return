[project]
name = "fbr-tax-return"
version = "0.1.0"
description = "Local-only aggregator for Pakistani FBR individual tax return data"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13",
  "pandas>=3.0",
  "streamlit>=1.64",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.10",
  "xlsxwriter>=3.2.9",
]

[project.scripts]
fbr-dump = "tools.dump_layout:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "reportlab>=5.0",
    "pypdf[crypto]>=6.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbr", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
python-downloads = "manual"
